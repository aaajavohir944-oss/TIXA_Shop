<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TIXA Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome Ikonkalar uchun -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- ASOSIY KONTEYNER -->
    <div id="main-content" class="page-container">
        
        <!-- TOP HEADER / PROFIL & BALANS -->
        <div class="user-profile-card">
            <div class="user-info">
                <span class="user-name" id="user-fullname">Foydalanuvchi</span>
                <div class="balance-box">
                    <span>Topup balance</span>
                    <strong id="user-balance">0 UZS</strong>
                </div>
            </div>
            <button class="topup-btn" onclick="openTab('wallet')">
                <i class="fa-solid fa-plus"></i> To'ldirish
            </button>
        </div>

        <!-- ID VA SERVER KIRITISH -->
        <div class="id-card">
            <div class="input-field">
                <label><i class="fa-solid fa-user"></i> O'YINCHI ID</label>
                <input type="number" id="mlbb-id" placeholder="O'yinchi ID kiriting">
            </div>
            <div class="input-field">
                <label><i class="fa-solid fa-server"></i> SERVER ID</label>
                <div class="server-group">
                    <input type="number" id="zone-id" placeholder="Server ID kiriting">
                    <button class="check-btn" onclick="checkAccount()">Tekshirish</button>
                </div>
            </div>
        </div>

        <!-- MINTAQA TABLARI -->
        <div class="region-tabs">
            <button class="tab-btn active">uzUZB / 🌐 Global</button>
            <button class="tab-btn">RU RU</button>
            <button class="tab-btn">TURK TR</button>
            <button class="tab-btn">ID ID</button>
        </div>

        <!-- TOVARLAR SETKASI -->
        <div class="products-grid">
            <div class="product-card" onclick="selectProduct(this, 'Super Foydali Propusk', 10000)">
                <div class="prod-title">Super Foydali Propusk</div>
                <div class="prod-price">10 000 UZS</div>
            </div>

            <div class="product-card" onclick="selectProduct(this, 'Oylik elit pack', 53200)">
                <div class="prod-title">Oylik elit pack</div>
                <div class="prod-price">53 200 UZS</div>
            </div>

            <div class="product-card" onclick="selectProduct(this, '50 + 5 💎', 10305)">
                <div class="badge">+45 birinchi xarid</div>
                <div class="prod-title">50 + 5 💎</div>
                <div class="prod-price">10 305 UZS</div>
            </div>

            <div class="product-card" onclick="selectProduct(this, '150 + 15 💎', 30808)">
                <div class="badge">+135 birinchi xarid</div>
                <div class="prod-title">150 + 15 💎</div>
                <div class="prod-price">30 808 UZS</div>
            </div>

            <div class="product-card" onclick="selectProduct(this, '257 💎', 46494)">
                <div class="prod-title">257 💎 (234 + 23)</div>
                <div class="prod-price">46 494 UZS</div>
            </div>

            <div class="product-card" onclick="selectProduct(this, '706 💎', 125460)">
                <div class="prod-title">706 💎 (625 + 81)</div>
                <div class="prod-price">125 460 UZS</div>
            </div>
        </div>
    </div>

    <!-- SOTIB OLISH (STICKY BUY BUTTON) -->
    <div class="sticky-buy-bar">
        <button id="buy-btn" class="buy-now-btn" disabled onclick="submitOrder()">
            Sotib olish
        </button>
    </div>

    <!-- PASTKI NAVIGATSIYA MENUSI -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchPage('home')">
            <i class="fa-solid fa-border-all"></i>
            <span>Bosh sahifa</span>
        </div>
        <div class="nav-item" onclick="switchPage('wallet')">
            <i class="fa-solid fa-wallet"></i>
            <span>Hamyon</span>
        </div>
        <div class="nav-item" onclick="switchPage('history')">
            <i class="fa-clock-rotate-left"></i>
            <span>Tarix</span>
        </div>
        <div class="nav-item" onclick="switchPage('profile')">
            <i class="fa-solid fa-user"></i>
            <span>Profil</span>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
